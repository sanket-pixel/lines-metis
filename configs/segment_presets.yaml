# Distances and lengths are in network pixels; angle_tolerance is in radians.
strict:
  max_distance: 1.5
  angle_tolerance: 0.34906585
  region_radius: 1.5
  min_length: 10.0
  min_support: 0.8
  min_pixels: 10
  duplicate_distance: 2.5
  merge_gap: 4.0
  merge_distance: 1.25
  max_mean_distance: 0.8

# Experimental presets for visual comparison; strict remains the accepted baseline.
balanced:
  max_distance: 2.0
  angle_tolerance: 0.43633231
  region_radius: 1.75
  min_length: 10.0
  min_support: 0.7
  min_pixels: 8
  duplicate_distance: 2.5
  merge_gap: 8.0
  merge_distance: 1.5
  max_mean_distance: 1.1

relaxed:
  max_distance: 2.5
  angle_tolerance: 0.52359878
  region_radius: 2.0
  min_length: 8.0
  min_support: 0.6
  min_pixels: 6
  duplicate_distance: 2.5
  merge_gap: 12.0
  merge_distance: 2.0
  max_mean_distance: 1.5
